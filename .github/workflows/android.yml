name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: android
    env:
      GH_TOKEN: ${{ github.token }}
      BETA_TAG: android-beta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key (only if the secret exists)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > app/release.jks; echo "Using permanent key"; else echo "No key secret: temporary debug key"; fi

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk ../PeterAutoClicker-android.apk

      # Private draft release (only you can see it) holding the test APK
      - name: Upload test APK to draft release
        run: |
          cd ..
          gh release view "$BETA_TAG" >/dev/null 2>&1 || gh release create "$BETA_TAG" --draft --target main --title "Android beta (private test build)" --notes "Test build"
          gh release upload "$BETA_TAG" PeterAutoClicker-android.apk --clobber
          gh release edit "$BETA_TAG" --notes "Build OK from ${GITHUB_SHA::7} at $(date -u +%H:%M) UTC"

      # If the build fails, put the end of the log in the private draft release so it can be read
      - name: Report failure
        if: failure()
        run: |
          cd ..
          { echo "BUILD FAILED at ${GITHUB_SHA::7}"; echo '```'; grep -E "error:|ERROR|FAILURE|What went wrong|\.java:[0-9]+" android/build.log | head -60; echo '---'; tail -n 60 android/build.log; echo '```'; } > fail.md || echo "BUILD FAILED (no log)" > fail.md
          gh release view "$BETA_TAG" >/dev/null 2>&1 || gh release create "$BETA_TAG" --draft --target main --title "Android beta (private test build)" --notes "Test build"
          gh release edit "$BETA_TAG" --notes-file fail.md
